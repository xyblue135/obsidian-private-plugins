name: Release xyblue135 Plugins

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package each xyblue135 plugin (exclude data.json)
        run: |
          shopt -s nullglob
          mkdir -p dist
          for d in 00_xyblue135-*/; do
            name="${d%/}"
            # 每个插件单独打包，排除 data.json（含凭据/用户配置）与 .git
            zip -r "dist/${name}.zip" "$d" -x "${d}data.json" -x "${d}.git/*"
            echo "打包: ${name}.zip"
          done
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "xyblue135 插件合集 ${{ github.ref_name }}"
          files: dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
