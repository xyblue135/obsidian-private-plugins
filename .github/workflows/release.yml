name: Release Plugins Snapshot

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package plugins directory
        run: |
          TAG="${GITHUB_REF_NAME}"
          ZIP="obsidian-plugins-${TAG}.zip"
          # 打包仓库全部内容（即插件目录），排除 .git
          zip -r "$ZIP" . -x '*.git*'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "打包完成: $ZIP"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
